spring.application.name=receipt-service

# Storage strategy: sqlite (default, persistent) or memory (ConcurrentHashMap, non-persistent)
# Override with: --app.storage.type=memory  (or activate the "memory" profile, see application-memory.properties)
app.storage.type=sqlite

# SQLite file-based database (created next to where the app runs)
spring.datasource.url=jdbc:sqlite:receipts.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.upload-dir=uploads
