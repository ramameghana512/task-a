# Activate with: --spring.profiles.active=memory
# Pure in-memory storage - no SQLite/JDBC needed at all, data is lost on restart.
app.storage.type=memory

# Skip JPA/DataSource auto-configuration entirely so no DB connection is attempted.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration,org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
