spring:
  application:
    name: receipt-service
  datasource:
    url: jdbc:sqlite:/Users/daliparthi.meghana/Downloads/task-a/receipts.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 2
      connection-timeout: 10000
  jpa:
    open-in-view: false
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  storage:
    type: sqlite
  upload-dir: uploads
  ocr:
    strategy: stub   # stub (default) | vendor
